# -------------------------------------------------------------
# Configurações de Conexão com o PostgreSQL
# -------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/topicos2db
quarkus.datasource.username=topicos2
quarkus.datasource.password=123456

# -------------------------------------------------------------
# Hibernate ORM & Flyway
# -------------------------------------------------------------
# Desativa a criação automática do esquema pelo Hibernate
quarkus.hibernate-orm.database.generation=none

# Habilita a execução das migrações do Flyway ao iniciar a aplicação
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Desabilita o Quarkus Dev Services (não exige Docker em modo dev/test)
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false
%test.quarkus.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=false
quarkus.log.category."org.testcontainers".level=OFF

# -------------------------------------------------------------
# Configuração de CORS (Habilita comunicação com o Angular na 4200)
# -------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Authorization
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS
quarkus.analytics.disabled=true

# -------------------------------------------------------------
# Segurança e Autenticação JWT (SmallRye JWT)
# -------------------------------------------------------------
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=psi-jwt
smallrye.jwt.sign.key.location=privateKey.pem
psi.jwt.duration-seconds=28800

# -------------------------------------------------------------
# OpenAPI / Swagger UI
# -------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=PSI API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Documentação interativa da API REST do PSI
